<style>
  :root {
    --bg: #0f0f0f;
    --card: #1c1c1c;
    --card-hover: #292929;
    --text: #ffffff;
    --muted: #a0a0a0;
    --accent: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .container { width: 100%; max-width: 460px; text-align: center; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: #333; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .bio { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .ig-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text); text-decoration: none; font-size: 14px;
    margin-bottom: 28px; opacity: 0.85;
  }
  .link-card {
    display: block;
    background: var(--card);
    color: var(--text);
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 14px;
    margin-bottom: 12px;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.15s ease, transform 0.1s ease;
    border: 1px solid #2a2a2a;
  }
  .link-card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .empty { color: var(--muted); font-size: 14px; padding: 24px 0; }
  footer { margin-top: 32px; color: #555; font-size: 12px; }
</style>
</head>
